<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Abo-Verwaltung</title>
    <base href="https://amir-pdf.github.io/sub/src/main/resources/static/style.css">
    <!-- CSS-Datei einbinden -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Abo hinzufügen</h1>
<form id="aboForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="number" step="0.01" id="price" placeholder="Preis" required>
    <select id="billingCycle">
        <option value="MONTHLY">Monatlich</option>
        <option value="YEARLY">Jährlich</option>
        <option value="QUARTERLY">Vierteljährlich</option>
    </select>
    <input type="date" id="startDate" required>
    <label><input type="checkbox" id="active" checked> Aktiv</label>
    <button type="submit">Speichern</button>
</form>

<h2>Übersicht</h2>
<ul id="aboList"></ul>

<!-- JavaScript-Datei einbinden -->
<script src="/app.js" defer></script>
</body>
</html>
