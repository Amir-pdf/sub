version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Rima0911.
    ports:
      - "1433:1433"
    networks:
      - app-net

  subscription-app:
    build: .
    container_name: subscription_service
    ports:
      - "8080:8080"
    environment:
      # Hier verbindet sich Spring Boot mit dem Docker-Datenbank-Container
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=Subscription;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Rima0911.
    depends_on:
      - sqlserver
    networks:
      - app-net

networks:
  app-net:
    driver: bridge